name: Build ProfitPulse Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Build Installable Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 21 (Required by Capacitor 6 / Android Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor Dependencies
        run: npm install

      - name: Add or Sync Android Platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            npx cap sync android
          fi

      - name: Build Debug APK with Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK to ProfitPulse.apk
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./ProfitPulse.apk

      - name: Upload ProfitPulse.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProfitPulse-Android-APK
          path: ./ProfitPulse.apk
          if-no-files-found: error
